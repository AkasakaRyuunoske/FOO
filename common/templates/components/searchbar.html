<form method="get" action="{{ action|default:'' }}" class="w-full max-w-md mx-auto">
  <div class="relative">
    <input
      type="text"
      name="{{ input_name|default:'q' }}"
      placeholder="{{ placeholder|default:'Search...' }}"
      class="w-full p-2 border border-black rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      hx-trigger="keyup changed delay:300ms"
      hx-target="#available_tags"
      hx-swap="outerHTML"
    />
  </div>
</form>

<div class="grid grid-cols-3 auto-rows-min gap-2 items-start" id="available_ingredients">
  {% for item in ingredients %}
    <div
      class="clickable-ingredient inline-flex items-center text-gray-800 relative cursor-pointer border border-transparent hover:border-black transition-colors duration-150 rounded p-1"
      data-ingredient="{{ item }}"
    >
      {{ item }}
    </div>
  {% empty %}
    <div class="text-gray-500 relative">No ingredients found.</div>
  {% endfor %}
</div>

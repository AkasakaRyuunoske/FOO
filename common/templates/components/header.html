<header class="bg-white text-black border border-black rounded-lg">
    <div class="w-full px-4 py-2 flex items-center justify-between">
        <!-- Column 1: Logo & Name -->
        <a href="/"
           class="flex items-center space-x-2 focus:outline-none cursor-pointer">
      <span class="material-symbols-outlined text-3xl">
        chef_hat
      </span>
            <span class="text-xl font-semibold">Foo</span>
        </a>

        <!-- Column 2: Discover & Profile -->
        <div class="flex items-center space-x-6">
            <!-- Discover Recipes -->
            <a href="/discover"
               class="focus:outline-none cursor-pointer hover:text-gray-700"
               aria-label="Discover Recipes"
               title="Discovery Page">
                <span class="material-symbols-outlined text-3xl">
                    menu_book_2
                </span>
            </a>

            <!-- Add New Recipe -->
            <button
                    id="open-new-recipe-modal"
                    aria-haspopup="dialog"
                    aria-controls="new-recipe-modal"
                    class="focus:outline-none cursor-pointer hover:text-gray-700"
                    aria-label="Add Recipe"
                    title="Add Recipe"
            >
                <span class="material-symbols-outlined text-3xl">list_alt_add</span>
            </button>

            <!-- User Profile Icon -->
              <a href="/users/profile"
                 class="focus:outline-none cursor-pointer hover:text-gray-700"
                 aria-label="User Profile"
                 title="User Profile">
                <span class="material-symbols-outlined text-3xl">
                  account_circle
                </span>
              </a>
        </div>
    </div>

    <div
            id="new-recipe-modal"
            class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden flex items-center justify-center"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
    >
        <div class="bg-white w-full max-w-2xl max-h-[95vh] rounded-lg overflow-hidden px-8 py-4 flex flex-col">
            <button
                    id="close-new-recipe-modal"
                    aria-label="Close dialog"
                    class="ml-auto text-red-500 hover:text-red-800 focus:outline-none px-4 py-1 cursor-pointer"
            >
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="overflow-y-auto max-h-[90vh]">
                {% include "new_recipe.html" %}
            </div>
        </div>
    </div>

    <script>
        class Modal {
            constructor(openBtn, modalEl, closeBtn) {
                this.modal = modalEl;
                openBtn.addEventListener('click', () => this.open());
                closeBtn.addEventListener('click', () => this.close());
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') this.close();
                });
            }

            open() {
                this.modal.classList.remove('hidden');
            }

            close() {
                this.modal.classList.add('hidden');
            }
        }

        new Modal(
            document.getElementById('open-new-recipe-modal'),
            document.getElementById('new-recipe-modal'),
            document.getElementById('close-new-recipe-modal')
        );
    </script>

</header>

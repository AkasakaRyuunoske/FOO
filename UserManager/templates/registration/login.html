{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'UserManager/form.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&display=swap" rel="stylesheet">
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<main class="display-center">
    <a href="/"
       class="flex items-center space-x-2 focus:outline-none cursor-pointer">
            <span class="material-symbols-outlined text-3xl">
                chef_hat
            </span>
        <span class="text-xl font-semibold">FOO</span>
    </a>

    <div>
        <h2>Log In</h2>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}

            <a href="/forgot-password">Forgot password?</a>

            <input type="submit" value="Log In">
        </form>

        <div>
            <p>Don't have an account?</p>
            <a href="/users/register" class="underline">Sign Up</a>
        </div>
    </div>

    <div>
        <p>Terms of UsePrivacy Policy</p>
        <p>This site is protected by reCAPTCHA Enterprise. Google's Privacy Policy and Terms of Service apply.</p>
    </div>
</main>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-white text-black min-h-screen">
<main class="flex flex-col items-center justify-center min-h-screen px-4" role="main">
    <!-- Logo/Brand -->
    <header class="mb-8">
        <h1 class="text-2xl font-semibold text-center">FOO</h1>
    </header>

    <!-- Login Form Container -->
    <section class="w-full max-w-sm border border-black rounded-lg p-8 bg-white"
             aria-labelledby="login-heading">
        <h2 id="login-heading" class="text-xl font-medium mb-6 text-center">Log In</h2>

        <!-- Login Form -->
        <form method="post"
              action="{% url 'login' %}"
              hx-post="{% url 'login' %}"
              hx-target="#form-container"
              hx-swap="outerHTML"
              hx-indicator="#loading"
              class="space-y-4"
              novalidate>
            {% csrf_token %}

            <!-- Username Field -->
            <div class="space-y-2">
                <label for="{{ form.username.id_for_label }}"
                       class="block text-sm font-medium">
                    Username
                </label>
                <input type="text"
                       id="{{ form.username.id_for_label }}"
                       name="{{ form.username.name }}"
                       class="w-full px-3 py-2 bg-white border border-black rounded-md text-black placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-colors"
                       placeholder="Enter your username"
                       required
                       aria-describedby="username-error"
                       autocomplete="username">
                <div id="username-error" class="text-red-600 text-sm hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Password Field -->
            <div class="space-y-2">
                <label for="{{ form.password.id_for_label }}"
                       class="block text-sm font-medium">
                    Password
                </label>
                <input type="password"
                       id="{{ form.password.id_for_label }}"
                       name="{{ form.password.name }}"
                       class="w-full px-3 py-2 bg-white border border-black rounded-md text-black placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-colors"
                       placeholder="Enter your password"
                       required
                       aria-describedby="password-error"
                       autocomplete="current-password">
                <div id="password-error" class="text-red-600 text-sm hidden" role="alert" aria-live="polite"></div>
            </div>

            <!-- Forgot Password Link -->
            <div class="text-right">
                <a href="/forgot-password"
                   class="text-sm text-black underline hover:no-underline focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:ring-offset-white rounded transition-colors">
                    Forgot password?
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full py-2 px-4 mx-auto bg-black text-white font-medium rounded-md hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:ring-offset-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    id="login-button">
                Log In
            </button>
        </form>

        <!-- Sign Up Link -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-700 mb-2">Don't have an account?</p>
            <a href="/registration"
               class="text-black underline hover:no-underline focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:ring-offset-white rounded transition-colors">
                Sign Up
            </a>
        </div>
    </section>

    <!-- Footer/Legal -->
    <footer class="mt-8 text-center max-w-sm" role="contentinfo">
        <div class="text-xs text-gray-600 space-y-1">
            <p>
                <a href="/terms"
                   class="underline hover:no-underline focus:outline-none focus:ring-1 focus:ring-black rounded">Terms
                    of Use</a>
                <span class="mx-2">|</span>
                <a href="/privacy"
                   class="underline hover:no-underline focus:outline-none focus:ring-1 focus:ring-black rounded">Privacy
                    Policy</a>
            </p>
            <p>This site is protected by reCAPTCHA Enterprise. Google's Privacy Policy and Terms of Service apply.</p>
        </div>
    </footer>
</main>

<script>
    // Form validation and UX
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        const usernameInput = document.getElementById('{{ form.username.id_for_label }}');
        const passwordInput = document.getElementById('{{ form.password.id_for_label }}');

        // Real-time validation feedback
        function validateField(input, errorId, validationFn) {
            const errorEl = document.getElementById(errorId);
            input.addEventListener('blur', function () {
                const error = validationFn(input.value);
                if (error) {
                    errorEl.textContent = error;
                    errorEl.classList.remove('hidden');
                    input.setAttribute('aria-invalid', 'true');
                } else {
                    errorEl.classList.add('hidden');
                    input.setAttribute('aria-invalid', 'false');
                }
            });
        }

        // Username validation
        validateField(usernameInput, 'username-error', function (value) {
            if (!value.trim()) return 'Username is required';
            return null;
        });

        // Password validation
        validateField(passwordInput, 'password-error', function (value) {
            if (!value) return 'Password is required';
            return null;
        });

        // Form submission handling
        form.addEventListener('submit', function (e) {
            const button = document.getElementById('login-button');
            button.disabled = true;

            // Re-enable button after 2 seconds as fallback
            setTimeout(() => {
                button.disabled = false;
            }, 2000);
        });
    });

    // HTMX event handlers
    document.body.addEventListener('htmx:beforeRequest', function (evt) {
        document.getElementById('login-button').disabled = true;
    });

    document.body.addEventListener('htmx:afterRequest', function (evt) {
        document.getElementById('login-button').disabled = false;
    });
</script>
</body>
</html>
